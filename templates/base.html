<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}ExamForge AI{% endblock %}</title><link rel="stylesheet" href="/static/app.css"></head><body><header><a class="brand" href="/">ExamForge <span>AI</span></a>{% if user.is_authenticated %}<nav><a href="{% url 'question_create' %}">New item</a><a href="{% url 'assessment_create' %}">Build exam</a>{% if user.is_staff %}<a href="/admin/">Admin</a>{% endif %}<form action="{% url 'logout' %}" method="post">{% csrf_token %}<button>Sign out</button></form></nav>{% endif %}</header><main>{% for m in messages %}<div class="notice">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
